[project]
name = "northwind-service-desk-agent"
version = "0.1.0"
description = "Synthetic IT and HR service desk agent: a portfolio project covering agent design, evaluation, guardrails and observability."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]
"tools/**" = ["E501", "SIM905"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
